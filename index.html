<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAFF STORY STUDIO — Universal AI Storyboard & Video Production Planner</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #070a12; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-[#070a12] text-slate-100 min-h-screen font-sans antialiased flex flex-col">

  <header class="border-b border-slate-800/80 bg-[#0b0f19]/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center shadow-lg text-white font-bold">🎬</div>
        <div>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
            RAFF STORY STUDIO
          </h1>
          <p class="text-[10px] text-slate-400 font-medium tracking-wider">Powered by Gemini & Nano Banana Engine</p>
        </div>
      </div>
      <div id="app-toast-inline" class="hidden text-xs font-semibold px-2.5 py-0.5 rounded-md bg-indigo-950/90 border border-indigo-500/40 text-indigo-200 animate-pulse">
        <span id="toast-text">Mesej sistem</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <div class="lg:col-span-5 space-y-3">
        <button id="btn-open-story-idea-modal" class="w-full py-4 px-5 rounded-2xl glass-card border border-indigo-500/40 hover:border-indigo-500 transition flex items-center justify-between shadow-xl text-left">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">✍️</div>
            <div>
              <h4 class="text-sm font-extrabold text-white">Idea Cerita & AI Analysis</h4>
              <p id="story-preview-summary-text" class="text-xs text-slate-400 truncate max-w-[280px]">Klik untuk masukkan idea cerita...</p>
            </div>
          </div>
        </button>
      </div>
    </div>
  </main>

  <!-- Modal Input -->
  <div id="modal-story-idea" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#0d121f] border border-slate-800 rounded-3xl max-w-xl w-full p-6 space-y-5 shadow-2xl relative">
      <h3 class="text-base font-bold text-white">Idea Cerita & Parameter Produksi</h3>
      <textarea id="story-text-input" rows="4" placeholder="Taip idea cerita anda di sini..." class="w-full bg-[#0a0e1a] border border-slate-800 rounded-2xl p-4 text-slate-100 text-sm outline-none"></textarea>
      <button id="btn-analyze-story" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm uppercase transition flex items-center justify-center gap-2">
        <span id="analyze-btn-caption">ANALYZE STORY</span>
        <span id="analyze-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      </button>
    </div>
  </div>

  <script>
    function showToast(msg) {
      const toast = document.getElementById('app-toast-inline');
      if (!toast) return;
      document.getElementById('toast-text').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    document.getElementById('btn-open-story-idea-modal').addEventListener('click', () => {
      document.getElementById('modal-story-idea').classList.remove('hidden');
    });

    document.getElementById('btn-analyze-story').addEventListener('click', async () => {
      const idea = document.getElementById('story-text-input').value.trim();
      if (!idea) { showToast("Sila masukkan idea cerita."); return; }

      const btn = document.getElementById('btn-analyze-story');
      const spinner = document.getElementById('analyze-spinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: `Jana skrip cerita ringkas berdasarkan idea ini: ${idea}` }] }],
            isImageGeneration: false
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Ralat pelayan");

        showToast("Analisis berjaya!");
        document.getElementById('modal-story-idea').classList.add('hidden');
      } catch (err) {
        showToast("Ralat: " + err.message);
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
